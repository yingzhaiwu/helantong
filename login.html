<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录 / 注册 - 荷兰同城</title>
<meta name="description" content="登录荷兰同城，免费发布招聘、求职、租房、商铺、交友、优惠信息。新用户注册即送100积分。">
<meta name="keywords" content="荷兰同城登录,荷兰同城注册,荷兰华人社区">
<meta name="author" content="荷兰同城 NTC">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0E3B4A">
<meta property="og:title" content="登录 / 注册 - 荷兰同城">
<meta property="og:description" content="登录荷兰同城，免费发布招聘、求职、租房、商铺、交友、优惠信息。新用户注册即送100积分。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ntc.nl/login.html">
<link rel="canonical" href="https://ntc.nl/login.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23DF7A3A'/%3E%3Cpath d='M12.2 15.2c0-4.1 2.2-6.6 4.3-4.6.9-2.9 5.2-2.9 6.1 0 2.1-2 4.3.5 4.3 4.6 0 5.1-3.6 8.8-7.35 8.8s-7.35-3.7-7.35-8.8z' fill='white'/%3E%3Cpath d='M20 24v9.4' stroke='white' stroke-width='2.1' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="page-content">
  <div class="auth-wrap">
    <div style="text-align:center;margin-bottom:18px">
      <a href="index.html" style="display:inline-flex;align-items:center;gap:8px">
        <span id="logoSlot"></span>
      </a>
    </div>

    <div id="inviteNotice"></div>

    <div class="card auth-card">
      <div class="auth-switch" id="authSwitch">
        <button class="active" data-m="login">登录</button>
        <button data-m="register">注册</button>
        <button data-m="forgot">找回密码</button>
      </div>
      <div class="auth-title" id="authTitle">欢迎回来 👋</div>
      <div class="auth-sub" id="authSub">登录后即可发布信息、收藏与评论</div>

      <!-- 登录 -->
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="l_email">邮箱地址</label>
          <input class="input" id="l_email" type="email" placeholder="请输入邮箱地址" value="">
        </div>
        <div class="form-group">
          <label class="form-label" for="l_pwd">密码</label>
          <input class="input" id="l_pwd" type="password" placeholder="请输入密码" value="">
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <label class="check-line"><input type="checkbox" id="l_remember" checked> 记住我</label>
          <a href="javascript:void(0)" id="toForgot" style="color:var(--brand-600);font-size:13px">忘记密码？</a>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">登 录</button>
      </form>

      <!-- 注册 -->
      <form id="regForm" class="hide">
        <div class="form-group">
          <label class="form-label" for="r_name">昵称 <span class="req">*</span></label>
          <input class="input" id="r_name" placeholder="展示在信息里的名字" maxlength="20">
        </div>
        <div class="form-group">
          <label class="form-label" for="r_email">邮箱地址 <span class="req">*</span></label>
          <input class="input" id="r_email" type="email" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="r_code">验证码 <span class="req">*</span></label>
          <div class="code-row">
            <input class="input" id="r_code" placeholder="6 位验证码" maxlength="6">
            <button class="btn btn-outline" type="button" id="codeBtn">获取验证码</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="r_pwd">设置密码 <span class="req">*</span></label>
          <input class="input" id="r_pwd" type="password" placeholder="至少 6 位">
        </div>
        <label class="check-line" style="margin-bottom:14px">
          <input type="checkbox" id="r_agree"> 我已阅读并同意
          <a href="about.html#rules" target="_blank" style="color:var(--brand-600);font-weight:700">《用户协议》</a>
          与
          <a href="privacy.html" target="_blank" style="color:var(--brand-600);font-weight:700">《隐私政策》</a>
        </label>
        <p style="font-size:12px;color:var(--ink-3);margin:-8px 0 14px;line-height:1.8">
          🍪 我们仅在必要范围内使用 Cookie 与本地存储；偏好与统计类别需你同意后启用，可随时在
          <a href="javascript:void(0)" id="loginCookieSet" style="color:var(--brand-600);font-weight:700">Cookie 设置</a>
          或
          <a href="cookie.html" target="_blank" style="color:var(--brand-600);font-weight:700">Cookie 政策</a>
          中更改 / 撤回。
        </p>
        <button class="btn btn-primary btn-lg btn-block" type="submit">注册并登录</button>
      </form>

      <!-- 找回密码 -->
      <form id="forgotForm" class="hide">
        <div id="forgotStep1">
          <div class="form-group">
            <label class="form-label" for="f_email">邮箱地址</label>
            <input class="input" id="f_email" type="email" placeholder="请输入注册时的邮箱地址">
          </div>
          <div class="form-group">
            <label class="form-label" for="f_code">验证码</label>
            <div class="code-row">
              <input class="input" id="f_code" placeholder="6 位验证码" maxlength="6">
              <button class="btn btn-outline" type="button" id="fcodeBtn">获取验证码</button>
            </div>
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit" id="f_next">下一步</button>
        </div>
        <div id="forgotStep2" class="hide">
          <div class="form-group">
            <label class="form-label">找回结果</label>
            <div class="forgot-result" id="forgotResult"></div>
          </div>
          <button class="btn btn-outline btn-lg btn-block" type="button" id="f_back">返回登录</button>
        </div>
      </form>

      <p style="text-align:center;color:var(--ink-3);font-size:12px;margin-top:14px">
        演示站点：验证码不会真实发送，点击「获取验证码」后输入任意 6 位数字即可
      </p>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>

<body>

<div id="page-content">
  <div class="container">
    <nav class="breadcrumb" id="crumb"></nav>

    <div class="card filter-card">
      <div class="filter-row">
        <div class="filter-label">分类</div>
        <div class="filter-opts" id="catOpts"></div>
      </div>
      <div class="filter-row">
        <div class="filter-label">城市</div>
        <div class="filter-opts" id="cityOpts"></div>
      </div>
      <div class="filter-row">
        <div class="filter-label">类型</div>
        <div class="filter-opts" id="subOpts"></div>
      </div>
      <div class="filter-row">
        <div class="filter-label">价格</div>
        <div class="filter-opts" id="priceOpts"></div>
      </div>
      <div class="filter-extra">
        <div class="search-inline">
          <input class="input" id="kw" placeholder="在本分类中搜索关键词…">
          <button class="btn btn-primary" id="searchBtn">筛选</button>
          <button class="btn btn-outline" id="resetBtn">重置</button>
        </div>
      </div>
    </div>

    <div class="result-bar">
      <div class="count">共找到 <b id="count">0</b> 条信息</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select class="select" id="sortSel">
          <option value="new">最新发布</option>
          <option value="hot">最多点赞</option>
          <option value="view">浏览最多</option>
          <option value="priceAsc">价格从低到高</option>
          <option value="priceDesc">价格从高到低</option>
        </select>
        <button class="btn btn-outline btn-sm" id="subBtn">🔔 订阅本分类</button>
        <a class="btn btn-primary btn-sm" href="publish.html">＋ 发布</a>
      </div>
    </div>

    <div class="post-list" id="list"></div>
    <div style="text-align:center;margin-top:16px">
      <button class="btn btn-outline btn-lg" id="moreBtn" style="min-width:180px">加载更多</button>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>

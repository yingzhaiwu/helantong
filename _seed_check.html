<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="out"></pre><script>
try{
  const slots = {
    ad1:{emoji:'',img:'',mode:'card',title:'过期广告测试',text:'这条应该显示已过期灰显',link:'https://example.com/old',expiresAt:Date.now()-86400000},
    ad2:{emoji:'',img:'',mode:'card',title:'正常广告',text:'这条应该正常显示可点击',link:'https://example.com/new',expiresAt:Date.now()+86400000}

  localStorage.setItem('hh_ad_slots', JSON.stringify(slots));
